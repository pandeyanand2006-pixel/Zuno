# Render Blueprint — ZUNO full-stack
# Deploy in 1 click: https://dashboard.render.com/select-repo?type=blueprint
# Or manually: New → Blueprint → connect repo → Render reads this file.
#
# This deploys ZUNO as a SINGLE Node Web Service that serves BOTH API + frontend
# (Express static serves public/ — no split needed).
# SQLite persists on a 1GB disk at /data (else data resets on each deploy).
services:
  - type: web
    name: zuno
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Render injects PORT=10000 automatically; app reads process.env.PORT
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # For Starter plan with persistent disk, use /data/ZUNO.db (disk mount below).
      # Free tier has no disk — uses ephemeral data/ZUNO.db (resets on deploy, Mongo fallback recommended).
      - key: DB_PATH
        value: /data/ZUNO.db
      # Set to your actual Vercel domain(s), comma-separated. Wildcard covers preview deploys.
      # Example: https://zuno.vercel.app,https://*.vercel.app
      - key: FRONTEND_URL
        value: https://*.vercel.app
      # REQUIRED for OTP emails to arrive in inbox (not just Render logs):
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        value: zunoworld3121@gmail.com
      - key: SMTP_PASS
        value: yyedxjileoszzsfz
      - key: SMTP_FROM
        value: ZUNO <zunoworld3121@gmail.com>
      # HTTPS fallback for Render free tier where SMTP 587 is blocked (ENETUNREACH 2607:f8b0::)
      # Create free key at https://app.brevo.com/settings/keys/api (300/day) or https://resend.com/api-keys (100/day) and set here:
      - key: BREVO_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      # If you rotate Gmail App Password, update SMTP_PASS above and redeploy
      # Alternative: set SMTP_USER/SMTP_PASS as sync:false and configure manually in Dashboard → Environment (more secure)
      # Optional — fill in Render dashboard > Environment after deploy:
      # MONGODB_URI=mongodb+srv://user:pass@cluster.mongodb.net/zuno?retryWrites=true&w=majority
      # RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET, GOOGLE_CLIENT_ID
      # IMPORTANT: SMTP_USER = your Gmail (e.g. zunoworld3121@gmail.com), SMTP_PASS = Gmail App Password (16 chars, no spaces, from myaccount.google.com/apppasswords), SMTP_FROM = ZUNO <same-email>
      # API_BASE_URL is auto-derived; no need to set.
    # Persistent disk — enable ONLY on paid plan (Starter $7+). Free tier: keep commented.
    # When enabled, DB_PATH=/data/ZUNO.db above will persist across deploys.
    # disk:
    #   name: zuno-data
    #   mountPath: /data
    #   sizeGB: 1

